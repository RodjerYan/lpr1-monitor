name: Keep Render Alive

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://lpr1-monitor-v3.onrender.com/
          curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://lpr1-monitor-v3.onrender.com/
