name: Keep Render Alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render (try 1)
        run: curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://lpr1-monitor.onrender.com/ || true
      - name: Wait 30s
        run: sleep 30
      - name: Ping Render (try 2)
        run: curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://lpr1-monitor.onrender.com/ || true
